services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ecom_ai
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ecom_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite+aiosqlite:///./ecom_ai.db
      AWS_REGION: us-east-1
      DEFAULT_AUTONOMY_LEVEL: 2
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  agent-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite+aiosqlite:///./ecom_ai.db
      AWS_REGION: us-east-1
    depends_on:
      - api
      - redis

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    depends_on:
      - api

volumes:
  pgdata:
